{% extends "web/base.html" %}
{% block title %}Run {{ run.short_id }} · {{ run.title }}{% endblock %}
{% block content %}
<p class="crumbs"><a href="{% url 'web:browse' %}">Analyses</a> › <a href="{{ run.notebook.get_absolute_url }}">{{ run.notebook.title }}</a> › Run <code>{{ run.short_id }}</code></p>
{% include "web/partials/run_status.html" %}
{% endblock %}
{% block scripts %}
<script>
  // Polling replaces #run-status, which resets run.log to the top. Follow the tail unless
  // the reader has scrolled up, in which case keep their position.
  (() => {
    const log = () => document.querySelector("#run-status .log");
    let follow, pos;
    document.body.addEventListener("htmx:beforeSwap", () => {
      const el = log();
      if (el) { pos = el.scrollTop; follow = el.scrollHeight - el.scrollTop - el.clientHeight < 24; }
    });
    document.body.addEventListener("htmx:afterSwap", () => {
      const el = log();
      if (el) el.scrollTop = follow ? el.scrollHeight : pos;
    });
    const el = log();
    if (el) el.scrollTop = el.scrollHeight;
  })();
</script>
{% endblock %}
