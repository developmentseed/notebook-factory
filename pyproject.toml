[project]
name = "notebook-factory"
version = "0.1.0"
description = "Montandon Notebooks: a Django app that indexes parameterized analysis notebooks, orchestrates their execution, and publishes them as static HTML."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "django>=5.1,<5.3",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "django-htmx>=1.19",
    "django-storages[s3,azure]>=1.14",
    "django-cors-headers>=4.4",
    "whitenoise>=6.7",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "django-celery-beat>=2.7",
    "gunicorn>=23.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "jinja2>=3.1",
    "papermill>=2.6",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "lonboard>=0.10",
    "anywidget>=0.9",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyarrow>=17",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pystac>=1.11",
    "pystac-client>=0.8",
    "requests>=2.32",
    "markdown>=3.10.3",
    # 47+ wheels SIGILL on some arm64 VMs (Colima); see README "Known sharp edges"
    "cryptography>=42,<47",
    "manywidgets[lonboard]>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "factory-boy>=3.3",
    "responses>=0.25",
    "django-debug-toolbar>=4.4",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebook_templates", "data", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
