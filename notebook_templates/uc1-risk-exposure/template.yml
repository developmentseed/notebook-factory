title: Population & infrastructure risk exposure
summary: How many people and which facilities are exposed to a hazard, before any event — a baseline for
  preparedness.
description: '**Use Case 1 · Risk · before the event.** Compares a hazard raster against a threshold to
  build a hazard mask, overlays population (WorldPop, 1 km), health facilities, schools, airports and ports,
  and aggregates exposed population (per return period and as an annual average) and facility counts per
  subdivision. Children under 5 and under 15 are broken out of the same population grid.


  > Needs the hazard rasters (flood, cyclone, earthquake) at `datasets_url`, a folder or URL. Population
  (WorldPop R2025A) is read through the WorldPop API: the `WORLDPOP_API_KEY` secret raises its limits
  (without a key an area is limited to 100,000 km², larger areas are requested in tiles). Facilities are
  OpenStreetMap features from HOT''s per-country extracts, one point (the centroid) each. Hazards without
  data (wildfire, heatwave) are not offered.'
filters:
  use_case:
  - uc1
  hazard:
  - flood
  - cyclone
  - earthquake
version: '0.4'
requires_area: true
estimated_runtime_minutes: 3
secrets:
- WORLDPOP_API_KEY
parameters:
  type: object
  properties:
    hazard:
      type: string
      title: Hazard
      enum:
      - flood
      - cyclone
      - earthquake
      default: flood
      x-enum-labels:
        flood: Riverine flood
        cyclone: Tropical cyclone
        earthquake: Earthquake
    intensity_threshold:
      type: number
      title: Hazard intensity threshold
      minimum: 0
      description: 'Leave blank for the hazard''s default: flood 0.5, cyclone 33, earthquake 0.22 (units
        of the hazard raster).'
    return_period:
      type: integer
      title: Return period (years)
      enum:
      - 10
      - 50
      - 100
      - 500
      - 1000
      default: 100
      description: For floods and cyclones. Earthquakes always use 475.
    climate_scenario:
      type: string
      title: Climate scenario
      enum:
      - current
      - future
      default: current
      x-widget: radio
      x-enum-labels:
        current: Current
        future: Future
      description: Flood and cyclone only.
    population_year:
      type: integer
      title: Population year (WorldPop)
      minimum: 2015
      maximum: 2030
      default: 2025
      description: WorldPop R2025A year. Years after the present are projections.
    aggregation_level:
      type: integer
      title: Aggregation subdivisions
      enum:
      - 1
      - 2
      default: 2
      x-enum-labels:
        '1': Admin level 1
        '2': Admin level 2
      description: Admin level used for zonal statistics.
    infrastructure_layers:
      type: array
      title: Infrastructure layers
      default:
      - health
      items:
        type: string
        enum:
        - health
        - schools
        - airports
        - ports
        x-enum-labels:
          health: Health facilities
          schools: Schools (amenity=school)
          airports: Airports (aeroway=aerodrome)
          ports: Ports (industrial=port, harbour=yes, landuse=port or harbour)
    datasets_url:
      type: string
      title: Hazard datasets location
      description: Folder or URL (https://, s3://, az://) that holds the hazard rasters (wrl_risk_ras_*.tif) directly.
      default: https://goplaygroundstorage.blob.core.windows.net/notebook-factory-playground-static-datasets-container/mapaction/216-hazard
  required:
  - hazard
  - datasets_url
