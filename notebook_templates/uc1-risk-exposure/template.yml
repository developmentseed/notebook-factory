title: Population & infrastructure risk exposure
summary: How many people and which facilities are exposed to a hazard, before any event — a baseline for
  preparedness.
description: '**Use Case 1 · Risk · before the event.** Compares a hazard raster against a threshold to
  build a hazard mask, overlays population and health facilities, and aggregates exposed population (per
  return period and as an annual average) and facility counts per subdivision.


  > Needs the hazard, population and facility datasets under `DATASETS_DIR`. Hazards without data yet
  (wildfire, heatwave) and other infrastructure layers fail with a clear error instead of showing fake
  data.'
use_case: uc1
hazards:
- flood
- cyclone
- earthquake
- wildfire
- heatwave
version: '0.3'
requires_area: true
estimated_runtime_minutes: 3
parameters:
  type: object
  properties:
    hazard:
      type: string
      title: Hazard
      enum:
      - flood
      - cyclone
      - earthquake
      - wildfire
      - heatwave
      default: flood
      x-enum-labels:
        flood: Riverine flood
        cyclone: Tropical cyclone
        earthquake: Earthquake
        wildfire: Wildfire
        heatwave: Heatwave
    intensity_threshold:
      type: number
      title: Hazard intensity threshold
      minimum: 0
      description: 'Leave blank for the hazard''s default: flood 0.5, cyclone 33, earthquake 0.22 (units
        of the hazard raster).'
    return_period:
      type: integer
      title: Return period (years)
      enum:
      - 10
      - 50
      - 100
      - 500
      - 1000
      default: 100
      description: For floods and cyclones. Earthquakes always use 475.
    climate_scenario:
      type: string
      title: Climate scenario
      enum:
      - current
      - future
      default: current
      x-widget: radio
      x-enum-labels:
        current: Current
        future: Future
      description: Flood and cyclone only.
    aggregation_level:
      type: integer
      title: Aggregation subdivisions
      enum:
      - 1
      - 2
      default: 2
      x-enum-labels:
        '1': Admin level 1
        '2': Admin level 2
      description: Admin level used for zonal statistics.
    infrastructure_layers:
      type: array
      title: Infrastructure layers
      default:
      - health
      items:
        type: string
        enum:
        - health
        - schools
        - airports
        - roads
        x-enum-labels:
          health: Health facilities
          schools: Schools (no data yet)
          airports: Airports (no data yet)
          roads: Primary roads (no data yet)
  required:
  - hazard
