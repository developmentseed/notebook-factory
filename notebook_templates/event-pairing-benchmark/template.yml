title: Event pairing benchmark
summary: Which method best decides that records from different sources are the same disaster? Scores the
  notebook-factory heuristic, a learned model and a System One decision model on a hand-labelled gold set.
description: '**Analysis · event pairing.** `monty:corr_id` cannot join sources, so a matcher has to. This
  notebook compares the rules in use across Montandon (corr_id, date + country, the extension''s CQL2 Algorithm 1),
  notebook-factory''s experimental time-and-distance heuristic, a logistic regression and a decision model (Jev
  and others, through OpenRouter''s Decisions API, asked pair by pair or about all candidates at once).


  Two label sets: a gold set of about 200 Montandon events grouped into 36 disasters across countries (AI-labelled,
  not yet reviewed by a person, consistent with the USGS and GLIDE references GDACS publishes), with close
  neighbours (three Herat earthquakes in 8 days, four Spanish disasters in six weeks) and cascades (Storm Daniel
  and the Derna floods); and a silver set labelled by GDACS''s references alone (`build_silver.py`).


  Reports precision / recall with 95% intervals on pairs that involve an impact source, calibration of the
  model''s confidence, records grouped into events (with example event cards), how aftershocks are treated, and
  the cost of running the method on the whole catalog.


  > Select **any Montandon event** when starting a run: it only supplies the catalog URL and key. The
  decision-model rows need the `OPENROUTER_API_KEY` secret, which must be granted to this template (remove
  it from `secrets` to run without).'
version: '0.1'
requires_area: false
requires_stac_item: true
stac_hints:
  profile: montandon
  roles:
  - event
supports_writeback: false
estimated_runtime_minutes: 10
secrets:
- OPENROUTER_API_KEY
parameters:
  type: object
  properties:
    block_days:
      type: integer
      title: Candidate window (days)
      description: Two records are candidates when their dates are at most this many days apart.
      default: 45
      minimum: 1
      maximum: 365
    decision_models:
      type: string
      title: Decision models
      description: OpenRouter model ids, comma-separated, pinned versions (list them with
        GET /api/v1/models?output_modalities=decisions). Empty skips the decision-model rows.
      default: typesafe/jev-1.14-20261014
    max_model_calls:
      type: integer
      title: Cap on Decisions API calls
      description: One call per candidate pair per model. The run skips the model rows if more are needed.
      default: 3000
      minimum: 0
      maximum: 20000
    l2:
      type: number
      title: Learned scorer ridge strength
      default: 1.0
      minimum: 0
      maximum: 100
    band_low:
      type: number
      title: Hybrid band, low
      description: Heuristic scores below this are settled as different without asking the model.
      default: 0.4
      minimum: 0
      maximum: 1
      multipleOf: 0.05
    band_high:
      type: number
      title: Hybrid band, high
      description: Heuristic scores at or above this are settled as the same disaster without asking the model.
      default: 0.7
      minimum: 0
      maximum: 1
      multipleOf: 0.05
    gate_days:
      type: number
      title: Pipeline date gate (days)
      description: Pairs whose records are more than this many days apart are settled as different before scoring.
      default: 7
      minimum: 0
      maximum: 365
    margin:
      type: number
      title: Pipeline ranking margin
      description: Keep a pair only if its score is within this of the best candidate each record has in the other's source.
      default: 0.15
      minimum: 0
      maximum: 1
      multipleOf: 0.05
    listwise:
      type: boolean
      title: Listwise decision model
      description: Also score with one call per record and source, all its candidates together.
      default: true
    max_candidates:
      type: integer
      title: Most candidates per listwise call
      default: 12
      minimum: 1
      maximum: 50
    distractors:
      type: integer
      title: Catalog distractors per listwise call
      description: Unlabelled catalog records added to each listwise call as realistic rivals. They are never scored. 0 adds none.
      default: 0
      minimum: 0
      maximum: 20
    describe_detail:
      type: boolean
      title: Send magnitude and end date to the model
      default: true
    bootstrap_samples:
      type: integer
      title: Resamples for the 95% intervals
      default: 1000
      minimum: 100
      maximum: 10000
    silver:
      type: boolean
      title: Also score the silver set
      description: Labels from the USGS ids and GLIDE numbers GDACS cites (silver_disasters.yml, built by build_silver.py).
      default: true
    stability_pairs:
      type: integer
      title: Pairs re-asked to measure stability
      description: Asked again and with the two records swapped. 0 skips.
      default: 100
      minimum: 0
      maximum: 1000
    scale_sample_days:
      type: integer
      title: Catalog days sampled for the cost estimate
      description: 0 skips the cost section.
      default: 7
      minimum: 0
      maximum: 31
    scale_sample_end:
      type: string
      title: Last day of the cost sample
      default: '2025-09-15'
    lean_prompts:
      type: boolean
      title: Lean model requests
      description: Ask only what linking needs, with the guidance stated once. About 2.7 times cheaper; in testing it made a few more wrong links on borderline pairs.
      default: false
    min_cross_hazard_magnitude:
      type: number
      title: Smallest quake compared with other hazards
      description: A smaller earthquake without a tsunami flag is only compared with other earthquakes.
      default: 5.0
      minimum: 0
      maximum: 9
