# Gold set for the event-pairing benchmark.
#
# Each entry under `disasters` is ONE real-world disaster and lists the Montandon event items that
# describe it. Two items in the same entry are a positive pair; two items in different entries of
# the same `window` are a negative pair. Items listed nowhere are unlabelled and never scored.
#
# How these labels were made: a person read titles, descriptions, dates, magnitudes and places in the
# live catalog (montandon-eoapi) and grouped the items, using public knowledge of each disaster. No
# deterministic ID was used as a label, so the scorers cannot "read the answer" off a shared ID.
# They are one reviewer's judgement: correct them in this file, the notebook re-scores on every run.
#
# Conventions
#   - Register-style sources (EM-DAT, GLIDE, IFRC, IDMC) hold one record per disaster. Precise
#     sources (USGS, GDACS, PDC, IBTrACS) hold per-shock / per-alert records: only the principal
#     shocks or alerts are listed, aftershocks and repeat alerts are left unlabelled.
#   - IFRC GO events are ingested as event items but describe response operations (an operation page can span
#     several disasters). They are scored as events here; dropping them changes no scorer's F1 by more than 0.01.
#   - Several shocks of one sequence that a register records as a single disaster are all members.
#   - `window` groups entries for leave-one-window-out cross-validation of the learned scorer.
#   - `kind` is for reporting only: confusable = a close neighbour of another entry (same country,
#     days apart); cascade = members carry different hazard types (a cyclone and its floods).
#   - Items that are genuinely ambiguous are under `ambiguous` and excluded, with the reason.

# Review log
#   2026-11-12  After the first run with a decision model (Jev 1.14), the 13 pairs on which both the notebook-factory
#   heuristic and the model disagreed with a label, and the 7 pairs only the model got wrong, were read against
#   the source records. Three records moved to `ambiguous` (see below): the register text shows each spans
#   several of the listed disasters. No label was changed to agree with a scorer and nothing was relabelled as a
#   positive. Labels that held up under that review: Cyclone Freddy versus the Maputo and Niassa floods (EM-DAT
#   keeps the 7 Feb flood 0078 and the 24 Feb storm 0095 as separate records) and the three Herat earthquakes
#   (EM-DAT 0636 and 0660 are separate records, GLIDE has three).
#   Labels revised after seeing results favour the scorers that were shown them: judge new scorers on windows
#   labelled before they were run.

#   2026-11-12 (later)  Held-out windows were labelled before scoring. Afterwards one inconsistency of mine was
#   found and fixed: the three records of the Davao Oriental M6.7 second shock (about 10 hours after the M7.4)
#   had been made members, while the Turkiye and Mandalay M6.7 aftershocks were ambiguous. They are ambiguous
#   now. It was spotted because the model scored them low, so it favours the model slightly: on the held-out
#   windows Jev's F1 moves from 0.971 to 0.980 and the other scorers by under 0.012.

