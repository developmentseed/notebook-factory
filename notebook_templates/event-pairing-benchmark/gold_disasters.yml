# Gold set for the event-pairing benchmark.
#
# Each entry under `disasters` is ONE real-world disaster and lists the Montandon event items that
# describe it. Two items in the same entry are a positive pair; two items in different entries of
# the same `window` are a negative pair. Items listed nowhere are unlabelled and never scored.
#
# How these labels were made: an AI agent (Claude) read titles, descriptions, dates, magnitudes and
# places in the live catalog (montandon-eoapi) and grouped the items, using public knowledge of each
# disaster. No person has reviewed them yet. They were cross-checked against the references GDACS
# publishes for its own events (`sourceid` = the USGS event, `glide` = the GLIDE number, from the GDACS
# API; Montandon does not ingest these fields): every gold GDACS record that cites a USGS or GLIDE record
# of the gold set sits in the same disaster as that record (0 conflicts on 2026-11-12). Scorers never see
# ids, so they cannot read the answer off a shared one. Correct labels in this file; the notebook
# re-scores on every run.
#
# Conventions
#   - An entry is one real-world disaster, across countries: the records of every affected country
#     belong to it (EM-DAT and GLIDE share one number across a disaster's country records).
#   - Register-style sources (EM-DAT, GLIDE, IFRC, IDMC, DesInventar) hold one record per disaster and
#     country. Precise sources (USGS, GDACS, PDC, IBTrACS) hold per-shock / per-alert records: only the
#     principal shocks or alerts are listed; repeat alerts are left unlabelled.
#   - Aftershocks are `ambiguous` for now: whether an aftershock is part of its mainshock's disaster is
#     an open definition (monty-stac-extension does not define it). Candidate rule: defer to the
#     registers, one EM-DAT DisNo, else one GLIDE number, is one disaster. Two shocks of one register
#     record within hours of each other (Kahramanmaras M7.8 and M7.5, Herat 7 Oct) stay members.
#   - Cascades (a cyclone and its floods, an earthquake and its tsunami) are one disaster, as in the
#     extension's hazard relations (`triggers` / `triggered by`).
#   - IFRC GO events are ingested as event items but describe response operations (an operation page can span
#     several disasters). They are scored as events here; dropping them changes no scorer's F1 by more than 0.01.
#   - `window` groups entries for leave-one-window-out cross-validation of the learned scorer.
#   - `kind` is for reporting only: confusable = a close neighbour of another entry (same country,
#     days apart); cascade = members carry different hazard types (a cyclone and its floods).
#   - Items that are genuinely ambiguous are under `ambiguous` and excluded, with the reason.

# Review log
#   2026-11-12  After the first run with a decision model (Jev 1.14), the 13 pairs on which both the notebook-factory
#   heuristic and the model disagreed with a label, and the 7 pairs only the model got wrong, were read against
#   the source records. Three records moved to `ambiguous` (see below): the register text shows each spans
#   several of the listed disasters. No label was changed to agree with a scorer and nothing was relabelled as a
#   positive. Labels that held up under that review: Cyclone Freddy versus the Maputo and Niassa floods (EM-DAT
#   keeps the 7 Feb flood 0078 and the 24 Feb storm 0095 as separate records) and the three Herat earthquakes
#   (EM-DAT 0636 and 0660 are separate records, GLIDE has three).
#   Labels revised after seeing results favour the scorers that were shown them: judge new scorers on windows
#   labelled before they were run.

#   2026-11-12 (later)  Held-out windows were labelled before scoring. Afterwards one inconsistency of mine was
#   found and fixed: the three records of the Davao Oriental M6.7 second shock (about 10 hours after the M7.4)
#   had been made members, while the Turkiye and Mandalay M6.7 aftershocks were ambiguous. They are ambiguous
#   now. It was spotted because the model scored them low, so it favours the model slightly: on the held-out
#   windows Jev's F1 moves from 0.971 to 0.980 and the other scorers by under 0.012.

#   2026-11-12 (review)  A review of the whole file against the catalog, after scoring. Every change below
#   touches windows that scorers had already been run on, held-out ones included (marked H).
#   - Mislabel fixed (H jpn-2011): the GDACS member 104722 was the M7.9 aftershock 29 min after the
#     mainshock (06:15 UTC, 36.2N 141.2E). The M9.0 mainshock (GDACS 104706, 05:46 UTC, 38.3N 142.4E) and
#     USGS official20110311054624120_30 (M9.1) replace it; 104722 is ambiguous like the other aftershocks.
#   - Missing members added: GDACS flood 3787-1 (same DFO number as gfd-event-3787, H), the GDACS mainshock
#     alerts for Kunar (H) and Haiti (H), IDMC "Typhoon Haiyan (Yolanda)" (H) and the GDACS Haiyan flood (H),
#     a 4th identical DesInventar Sumatra record (H), the GIDD copy of the Plentzia landslide.
#   - Aftershocks made consistent: Kyaukse M5.5 (16 days after Mandalay, its own GLIDE number and a GDACS
#     Red alert) moved from its own entry to `ambiguous`, like the Kunar and Cebu aftershocks.
#   - Across countries: records of the same disasters in Syria, Madagascar, Zimbabwe, Malawi, Haiti, Cuba,
#     Bahamas, Viet Nam and China added (EM-DAT country records of one DisNo, GLIDE records of one number,
#     IFRC and IDMC pages naming the storm or quake).
#   - New confusable neighbours: Typhoon Krosa (31 Oct 2013, northern Luzon, 8 days before Haiyan; H) and
#     the central Viet Nam floods of 14-20 Nov 2013 from Tropical Depression Podul (3 days after Haiyan
#     crossed Viet Nam; H), both found as unlabelled records next to the Haiyan window.

