{{- /*
Serves published runs from the bucket at https://<host><path>/. The MyST app navigates to
its base path (runs/<id>/) on load and object storage has no directory index, so a
trailing-slash request is mapped to index.html.
*/ -}}
{{- with .Values.publishedProxy }}
{{- $up := urlParse (required "publishedProxy.upstream" .upstream) }}
{{- $prefix := trimSuffix "/" $up.path }}
{{- $path := trimSuffix "/" .path }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-published-proxy
  labels:
    {{- include "nf.labels" $ | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      absolute_redirect off;  # Location: /path, not http://<pod host>:8080/path
      location = /healthz { access_log off; return 200; }

      # A run's root without its trailing slash (runs/ is the app's NOTEBOOK_PUBLISH_PREFIX).
      location ~ ^{{ $path }}/runs/[^/]+$ { return 301 $uri/; }

      location {{ $path }}/ {
        limit_except GET { deny all; }  # GET implies HEAD
        rewrite ^{{ $path }}/(.*/)?$ {{ $prefix }}/$1index.html break;
        rewrite ^{{ $path }}/(.*)$ {{ $prefix }}/$1 break;
        # The upstream hostname is resolved once at startup; add a `resolver` if its IPs change.
        proxy_pass {{ $up.scheme }}://{{ $up.host }};
        proxy_ssl_server_name on;
        # The app's session cookie must not reach the storage provider.
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        gzip on;
        gzip_proxied any;
        gzip_types text/css application/javascript application/json image/svg+xml;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-published-proxy
  labels:
    {{- include "nf.labels" $ | nindent 4 }}
    app.kubernetes.io/component: published-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nf.selector" $ | nindent 6 }}
      app.kubernetes.io/component: published-proxy
  template:
    metadata:
      labels:
        {{- include "nf.selector" $ | nindent 8 }}
        app.kubernetes.io/component: published-proxy
      annotations:
        checksum/config: {{ toJson . | sha256sum }}  # restart on config change
    spec:
      containers:
        - name: nginx
          image: {{ .image }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources: {{ toYaml .resources | nindent 12 }}
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: conf
          configMap:
            name: {{ $.Release.Name }}-published-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-published-proxy
  labels:
    {{- include "nf.labels" $ | nindent 4 }}
spec:
  selector:
    {{- include "nf.selector" $ | nindent 4 }}
    app.kubernetes.io/component: published-proxy
  ports:
    - { name: http, port: 80, targetPort: http }
{{- end }}
