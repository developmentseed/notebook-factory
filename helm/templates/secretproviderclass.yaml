{{- with .Values.secretProviderClass }}
{{- if .enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $.Release.Name }}
  labels:
    {{- include "nf.labels" $ | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "secretProviderClass.clientID" .clientID | quote }}
    tenantId: {{ required "secretProviderClass.tenantId" .tenantId | quote }}
    keyvaultName: {{ required "secretProviderClass.keyvaultName" .keyvaultName | quote }}
    # Key Vault names cannot contain "_"; go-deploy's Terraform stores FOO_BAR as FOO-BAR.
    objects: |
      array:
      {{- range .keys }}
        - |
          objectName: {{ replace "_" "-" . }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: {{ $.Values.existingSecret }}
      type: Opaque
      data:
      {{- range .keys }}
        - { objectName: {{ replace "_" "-" . }}, key: {{ . }} }
      {{- end }}
{{- end }}
{{- end }}
