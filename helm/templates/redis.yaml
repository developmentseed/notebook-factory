# Celery broker. No persistence: queued runs lost on restart are recovered with
# `manage.py stale_runs --requeue`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nf.redis" . }}
  labels:
    {{- include "nf.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nf.selector" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "nf.selector" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
          resources: {{ toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nf.redis" . }}
  labels:
    {{- include "nf.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nf.selector" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - { name: redis, port: 6379, targetPort: redis }
